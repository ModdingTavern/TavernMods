<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community Mods — The Modding Tavern</title>
<meta name="description" content="Browse the mods in this Modding Tavern index.">
<!-- `modindex.py site` bakes the mod list into MODS below. -->
<style>
  :root {
    --background: #1a1210;
    --foreground: #f0e6cc;
    --card: #241c17;
    --muted: #2e2218;
    --muted-foreground: #d0c4aa;
    --border: #4a3828;
    --primary: #e8a840;
    --primary-dim: #8a5e1a;
    --accent: #6ab0aa;
    --success: #6aaa72;
    --violet: #b9a0dc;
    --danger: #e08585;
    --ring: rgba(232, 168, 64, .35);
    --radius: .5rem;
    --serif: Georgia, "Times New Roman", serif;
    --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: Consolas, "SF Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font: 13.5px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { padding: 1.25rem 1.5rem 3rem; }

  header {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: .9rem; margin-bottom: .9rem;
  }
  .titles { flex: 1 1 20rem; min-width: 0; }
  h1 { font: 700 1.35rem/1.2 var(--serif); color: var(--primary); margin: 0 0 .15rem; }
  .lede { margin: 0; font-size: .82rem; }
  .lede code { font: .78rem var(--mono); color: var(--accent); }
  .lede a { color: var(--primary); }
  .controls { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; max-width: 100%; }

  .input {
    width: 17rem; max-width: 100%; padding: .35rem .6rem;
    background: var(--card); border: 1px solid var(--border);
    border-radius: calc(var(--radius) - 2px);
    color: var(--foreground); font: inherit;
  }
  .input::placeholder { color: var(--muted-foreground); }
  .input:focus { outline: none; border-color: var(--primary-dim); box-shadow: 0 0 0 3px var(--ring); }

  .segmented { display: flex; border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); overflow: hidden; }
  .segmented button {
    padding: .35rem .75rem; border: 0; cursor: pointer;
    background: var(--card); color: var(--muted-foreground); font: inherit;
  }
  .segmented button + button { border-left: 1px solid var(--border); }
  .segmented button:hover { color: var(--foreground); }
  .segmented button[aria-pressed="true"] { background: var(--muted); color: var(--primary); }

  .count { color: var(--muted-foreground); font-size: .78rem; margin-bottom: .6rem; }

  .grid { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr)); }
  .card {
    display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .shot {
    aspect-ratio: 16 / 9;
    display: grid; place-items: center;
    padding: .6rem; text-align: center;
    background: var(--muted); border-bottom: 1px solid var(--border);
    font: 700 .85rem/1.25 var(--serif); color: var(--primary);
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; }
  .card-body { padding: .55rem .65rem .65rem; display: flex; flex-direction: column; gap: .25rem; flex: 1; }
  .card-title { font: 700 .92rem/1.25 var(--serif); }
  .card-meta { font-size: .74rem; color: var(--muted-foreground); }
  .card-desc {
    font-size: .78rem; flex: 1; margin: .1rem 0 .25rem;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: .82rem; }
  thead th {
    position: sticky; top: 0; z-index: 1;
    background: var(--background); text-align: left; font-weight: 600;
    font-size: .7rem; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted-foreground);
    padding: .4rem .6rem; border-bottom: 1px solid var(--border);
  }
  th:nth-child(1) { width: 15%; }
  th:nth-child(2) { width: 15%; }
  th:nth-child(3) { width: 9%; }
  th:nth-child(4) { width: 5.5rem; }
  th:nth-child(5) { width: 13.5rem; }
  tbody td {
    padding: .32rem .6rem; border-bottom: 1px solid var(--border); vertical-align: middle;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  tbody tr:hover { background: var(--card); }
  td.name { font-weight: 600; }
  td.ver { color: var(--primary); font-family: var(--mono); }
  td.id { font: .74rem var(--mono); color: var(--muted-foreground); }

  a.plain { color: inherit; text-decoration: none; }
  a.plain:hover { color: var(--primary); text-decoration: underline; }

  .badges { display: flex; flex-wrap: wrap; gap: .25rem; }
  .badge {
    padding: .05rem .4rem; border: 1px solid var(--border); border-radius: 999px;
    font-size: .66rem; letter-spacing: .02em; color: var(--muted-foreground); white-space: nowrap;
  }
  .badge.version { color: var(--primary); border-color: var(--primary-dim); }
  .badge.windows { color: var(--accent); border-color: var(--accent); }
  .badge.server { color: var(--success); border-color: var(--success); }
  .badge.android { color: var(--violet); border-color: var(--violet); }
  .badge.parity { color: var(--danger); border-color: var(--danger); }
  .badge[title] { cursor: help; }
  td .badges { flex-wrap: nowrap; }

  .note { color: var(--muted-foreground); padding: 1.5rem 0; }

  .graph-wrap {
    position: relative; overflow: hidden;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  }
  .graph-wrap svg {
    display: block; width: 100%; height: min(72vh, 46rem); min-height: 22rem;
    touch-action: none; user-select: none; cursor: grab;
  }
  .graph-wrap svg.panning { cursor: grabbing; }
  .graph-tools { position: absolute; left: .5rem; top: .5rem; }
  .graph-tools button, .graph-info .close {
    padding: .2rem .55rem; cursor: pointer; font: inherit; font-size: .74rem;
    background: var(--background); color: var(--muted-foreground);
    border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px);
  }
  .graph-tools button:hover, .graph-info .close:hover { color: var(--foreground); }
  .graph-help {
    position: absolute; left: .6rem; bottom: .4rem; right: .6rem;
    font-size: .72rem; color: var(--muted-foreground); pointer-events: none;
  }
  .edge { stroke: var(--muted-foreground); stroke-opacity: .45; stroke-width: 1.4; }
  .edge.hot { stroke: var(--primary); stroke-opacity: 1; stroke-width: 2; }
  .arrow { fill: var(--muted-foreground); fill-opacity: .7; }
  .arrow.hot { fill: var(--primary); fill-opacity: 1; }
  .node { cursor: pointer; }
  .node circle { fill: var(--muted); stroke: var(--primary); stroke-width: 1.6; }
  .node.external circle { fill: var(--background); stroke: var(--muted-foreground); stroke-dasharray: 3 2; }
  .node.hot circle { fill: var(--primary-dim); }
  .node.selected circle { fill: var(--primary); }
  .node:focus { outline: none; }
  .node:focus-visible circle { stroke: var(--foreground); stroke-width: 2.5; }
  .node text {
    fill: var(--foreground); font-size: 11px; text-anchor: middle; pointer-events: none;
    paint-order: stroke; stroke: var(--card); stroke-width: 3px; stroke-linejoin: round;
  }
  .node.external text { fill: var(--muted-foreground); }
  .dim { opacity: .15; }
  .graph-info {
    display: none; position: absolute; top: .5rem; right: .5rem; width: 17rem; max-width: calc(100% - 1rem);
    max-height: calc(100% - 1rem); overflow: auto;
    padding: .6rem .7rem; font-size: .78rem;
    background: var(--background); border: 1px solid var(--border); border-radius: var(--radius);
  }
  .graph-info.open { display: block; }
  .graph-info .close { float: right; margin-left: .4rem; }
  .graph-info h3 { font: 700 .95rem/1.25 var(--serif); margin: 0 0 .15rem; }
  .graph-info p { margin: .35rem 0; }
  .graph-info .k {
    margin-top: .5rem; color: var(--muted-foreground);
    font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
  }
  .graph-info ul { margin: .15rem 0 0; padding-left: 1.1rem; }
  .graph-info li button {
    padding: 0; border: 0; background: none; cursor: pointer;
    color: var(--primary); font: inherit; text-align: left;
  }
  .graph-info li button:hover { text-decoration: underline; }
  .graph-info .min { color: var(--muted-foreground); font-family: var(--mono); font-size: .72rem; }
  @media (max-width: 640px) {
    .graph-info { position: static; width: auto; max-width: none; max-height: none; margin: 0 .5rem .5rem; }
    .graph-help { position: static; padding: 0 .6rem .4rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titles">
      <h1>Community Mods</h1>
      <p class="lede">
        Install from <strong>Mod Manager → Community Mods</strong> in TavernLauncher.
        A headless server takes the same ids in its <code>modlist</code>.
        Mod authors: <a href="builder.html">build a manifest</a>.
      </p>
    </div>
    <div class="controls">
      <input id="q" class="input" type="search" placeholder="Search mods, authors, ids…" autocomplete="off">
      <div class="segmented" role="group" aria-label="View">
        <button id="v-cards" type="button">Cards</button>
        <button id="v-table" type="button">Table</button>
        <button id="v-graph" type="button">Graph</button>
      </div>
    </div>
  </header>

  <div id="count" class="count"></div>
  <div id="view"></div>
  <p id="note" class="note"></p>
</div>

<script>
const MODS = /*__MODS__*/[];

const el = (id) => document.getElementById(id);
const text = (s) => String(s ?? "");

const hasTarget = (m, t) => (m.targets || []).includes(t);

// Parity is only enforced on a mod a server runs that also has a client build.
const parityApplies = (m) =>
  m.parity_required && hasTarget(m, "server") && (hasTarget(m, "client_windows") || hasTarget(m, "client_android"));

const TAGS = [
  [(m) => hasTarget(m, "client_windows"), "windows", "Windows",
   "Has a build for the game on Windows: SteamVR, a Quest over Link, or flycam."],
  [(m) => hasTarget(m, "server"), "server", "Server", "Has a build for game servers."],
  [(m) => hasTarget(m, "client_android"), "android", "Android",
   "Has a build for the standalone Quest headset (Android). Nothing installs these yet."],
  [parityApplies, "parity", "Parity",
   "You need the server's exact version of this mod to join."],
];

const tags = (parent, m) => {
  for (const [shown, cls, label, explain] of TAGS)
    if (shown(m)) put(parent, "span", `badge ${cls}`, label).title = explain;
  return parent;
};

// textContent only: these strings come from mod authors.
const put = (parent, tag, cls, value) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (value !== undefined) node.textContent = text(value);
  parent.append(node);
  return node;
};

// The id is a validated GitHub owner.repo; owners can't contain dots.
const owner = (m) => text(m.id).split(".")[0];
const repoUrl = (m) => `https://github.com/${owner(m)}/${text(m.id).slice(owner(m).length + 1)}`;
const ownerUrl = (m) => `https://github.com/${owner(m)}`;

const link = (parent, href, value) => {
  const a = put(parent, "a", "plain", value);
  a.href = href;
  a.target = "_blank";
  a.rel = "noopener";
  return a;
};

const card = (m) => {
  const node = document.createElement("article");
  node.className = "card";
  const shot = put(node, "div", "shot");
  const src = (m.screenshots || [])[0];
  if (src) {
    const img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "";
    img.src = src;
    shot.append(img);
  } else {
    shot.textContent = text(m.name);
  }
  const body = put(node, "div", "card-body");
  link(put(body, "div", "card-title"), repoUrl(m), m.name).title = "Source on GitHub";
  const meta = put(body, "div", "card-meta");
  meta.append("by ");
  link(meta, ownerUrl(m), m.author);
  put(body, "p", "card-desc", m.description);
  const badges = put(body, "div", "badges");
  put(badges, "span", "badge version", m.latest);
  tags(badges, m);
  return node;
};

const COLUMNS = ["Mod", "Id", "Author", "Latest", "Tags", "Description"];

const table = (list) => {
  const node = document.createElement("table");
  const head = put(node, "thead").insertRow();
  for (const label of COLUMNS) put(head, "th", null, label);
  const body = put(node, "tbody");
  for (const m of list) {
    const row = body.insertRow();
    link(put(row, "td", "name"), repoUrl(m), m.name).title = text(m.name);
    put(row, "td", "id", m.id).title = m.id;
    link(put(row, "td"), ownerUrl(m), m.author);
    put(row, "td", "ver", m.latest);
    tags(put(put(row, "td"), "div", "badges"), m);
    put(row, "td", null, m.description).title = text(m.description);
  }
  return node;
};

// -- graph view ------------------------------------------------------------------
const SVG_NS = "http://www.w3.org/2000/svg";
const svgPut = (parent, tag, attrs = {}) => {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  parent.append(node);
  return node;
};
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Built once, so the layout survives searching and switching views.
let graph = null;

const buildGraph = () => {
  const nodes = MODS.map(m => ({ id: m.id, mod: m, label: text(m.name) }));
  const byId = new Map(nodes.map(n => [n.id, n]));
  const edges = [];
  for (const m of MODS) {
    for (const [dep, min] of Object.entries(m.dependencies || {})) {
      if (!byId.has(dep)) {
        const n = { id: dep, mod: null, label: dep };
        nodes.push(n);
        byId.set(dep, n);
      }
      edges.push({ from: byId.get(m.id), to: byId.get(dep), min: text(min) });
    }
  }
  nodes.forEach((n, i) => {
    n.needs = edges.filter(e => e.from === n);
    n.neededBy = edges.filter(e => e.to === n);
    n.r = 7 + 2.2 * Math.sqrt(n.neededBy.length);
    const a = (i / nodes.length) * 2 * Math.PI;
    n.x = Math.cos(a) * 160; n.y = Math.sin(a) * 160; n.vx = 0; n.vy = 0;
  });

  const wrap = document.createElement("div");
  wrap.className = "graph-wrap";
  const svg = svgPut(wrap, "svg", { role: "img", "aria-label": "Mods and the mods they need" });
  const defs = svgPut(svg, "defs");
  for (const [id, cls] of [["arrow", "arrow"], ["arrow-hot", "arrow hot"]]) {
    const marker = svgPut(defs, "marker", { id, viewBox: "0 0 10 10", refX: 10, refY: 5,
      markerWidth: 9, markerHeight: 9, orient: "auto", markerUnits: "userSpaceOnUse" });
    svgPut(marker, "path", { d: "M0,0 L10,5 L0,10 z", class: cls });
  }
  const viewport = svgPut(svg, "g");
  const edgeLayer = svgPut(viewport, "g");
  const nodeLayer = svgPut(viewport, "g");
  for (const e of edges) {
    e.line = svgPut(edgeLayer, "line", { class: "edge", "marker-end": "url(#arrow)" });
    svgPut(e.line, "title").textContent = `${e.from.label} needs ${e.to.label} ${e.min} or later`;
  }
  for (const n of nodes) {
    n.g = svgPut(nodeLayer, "g", { class: n.mod ? "node" : "node external", tabindex: 0,
      "aria-label": n.mod ? n.label : `${n.label}, not in this index` });
    svgPut(n.g, "circle", { r: n.r });
    svgPut(n.g, "text", { y: n.r + 13 }).textContent = n.label;
  }

  const tools = document.createElement("div");
  tools.className = "graph-tools";
  const fitButton = put(tools, "button", null, "Fit");
  fitButton.type = "button";
  wrap.append(tools);
  const info = put(wrap, "div", "graph-info");
  put(wrap, "div", "graph-help",
    "Arrows point to what a mod needs. Drag a mod to move it, drag the background to pan, scroll or pinch to zoom, click a mod for details.");

  // A small force layout: every pair repels, each link pulls toward a set
  // length, and a weak pull keeps loose mods near the middle.
  let alpha = 0, frame = 0, k = 1, tx = 0, ty = 0, fitted = false, viewMoved = false;
  const tick = () => {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
        if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
        const d = Math.sqrt(d2), f = (5000 * alpha) / d2;
        a.vx -= (dx / d) * f; a.vy -= (dy / d) * f;
        b.vx += (dx / d) * f; b.vy += (dy / d) * f;
      }
    }
    for (const e of edges) {
      const dx = e.to.x - e.from.x, dy = e.to.y - e.from.y, d = Math.hypot(dx, dy) || 1;
      const f = ((d - 150) / d) * 0.08 * alpha;
      e.from.vx += dx * f; e.from.vy += dy * f;
      e.to.vx -= dx * f; e.to.vy -= dy * f;
    }
    for (const n of nodes) {
      if (n.fixed) { n.vx = n.vy = 0; continue; }
      n.vx = (n.vx - n.x * 0.012 * alpha) * 0.6;
      n.vy = (n.vy - n.y * 0.012 * alpha) * 0.6;
      n.x += n.vx; n.y += n.vy;
    }
  };
  const draw = () => {
    viewport.setAttribute("transform", `translate(${tx},${ty}) scale(${k})`);
    for (const e of edges) {
      const dx = e.to.x - e.from.x, dy = e.to.y - e.from.y, d = Math.hypot(dx, dy) || 1;
      e.line.setAttribute("x1", e.from.x + (dx / d) * e.from.r);
      e.line.setAttribute("y1", e.from.y + (dy / d) * e.from.r);
      e.line.setAttribute("x2", e.to.x - (dx / d) * (e.to.r + 2));
      e.line.setAttribute("y2", e.to.y - (dy / d) * (e.to.r + 2));
    }
    for (const n of nodes) n.g.setAttribute("transform", `translate(${n.x},${n.y})`);
  };
  const step = () => {
    tick(); draw();
    alpha *= 0.97;
    frame = alpha > 0.005 ? requestAnimationFrame(step) : 0;
  };
  const heat = (to) => {
    if (reducedMotion) return;
    alpha = Math.max(alpha, to);
    if (!frame) frame = requestAnimationFrame(step);
  };
  // Settle before the first paint, so the graph opens still.
  alpha = 1;
  while (alpha > 0.005) { tick(); alpha *= 0.985; }
  alpha = 0;

  const fit = () => {
    const w = svg.clientWidth, h = svg.clientHeight - 24;
    if (!w || h <= 0) return;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const n of nodes) {
      x0 = Math.min(x0, n.x - n.r - 60); x1 = Math.max(x1, n.x + n.r + 60);
      y0 = Math.min(y0, n.y - n.r - 12); y1 = Math.max(y1, n.y + n.r + 24);
    }
    k = Math.max(0.25, Math.min(1.6, w / (x1 - x0), h / (y1 - y0)));
    tx = w / 2 - ((x0 + x1) / 2) * k;
    ty = h / 2 - ((y0 + y1) / 2) * k;
    fitted = true;
    viewMoved = false;
    draw();
  };
  fitButton.addEventListener("click", fit);

  // The focused mod lights up its whole chain: what it needs, and what needs it.
  let hover = null, selected = null, query = "";
  const closure = (start, next) => {
    const seen = new Set(), todo = [start];
    while (todo.length) {
      for (const m of next(todo.pop())) {
        if (m !== start && !seen.has(m)) { seen.add(m); todo.push(m); }
      }
    }
    return seen;
  };
  const matches = (n) => !query || `${n.id} ${n.label} ${text(n.mod?.author)}`.toLowerCase().includes(query);
  const paint = () => {
    const focus = hover || selected;
    let lit, hot = () => false;
    if (focus) {
      const up = closure(focus, (n) => n.needs.map(e => e.to));
      const down = closure(focus, (n) => n.neededBy.map(e => e.from));
      lit = new Set([focus, ...up, ...down]);
      hot = (e) => ((e.from === focus || up.has(e.from)) && up.has(e.to))
                || ((e.to === focus || down.has(e.to)) && down.has(e.from));
    } else {
      lit = new Set(nodes.filter(matches));
    }
    for (const n of nodes) {
      n.g.classList.toggle("dim", !lit.has(n));
      n.g.classList.toggle("hot", !!focus && n !== focus && lit.has(n));
      n.g.classList.toggle("selected", n === selected);
    }
    for (const e of edges) {
      const on = hot(e);
      e.line.classList.toggle("hot", on);
      e.line.setAttribute("marker-end", on ? "url(#arrow-hot)" : "url(#arrow)");
      e.line.classList.toggle("dim", focus ? !on : !(lit.has(e.from) || lit.has(e.to)));
    }
  };

  const listOf = (title, items) => {
    if (!items.length) return;
    put(info, "div", "k", title);
    const ul = put(info, "ul");
    for (const [n, min] of items) {
      const li = put(ul, "li");
      const b = put(li, "button", null, n.label);
      b.type = "button";
      b.addEventListener("click", () => select(n));
      if (min) { li.append(" "); put(li, "span", "min", `${min} or later`); }
    }
  };
  const select = (n) => {
    selected = n;
    info.replaceChildren();
    info.classList.toggle("open", !!n);
    if (n) {
      const close = put(info, "button", "close", "×");
      close.type = "button";
      close.title = "Close";
      close.addEventListener("click", () => select(null));
      if (n.mod) {
        link(put(info, "h3"), repoUrl(n.mod), n.label).title = "Source on GitHub";
        const meta = put(info, "div", "card-meta");
        meta.append("by ");
        link(meta, ownerUrl(n.mod), n.mod.author);
        const badges = put(info, "div", "badges");
        badges.style.marginTop = ".35rem";
        put(badges, "span", "badge version", n.mod.latest);
        tags(badges, n.mod);
        put(info, "p", null, n.mod.description);
      } else {
        put(info, "h3", null, n.label);
        put(info, "p", null, "Not in this index. Mods that need it install only once a source that has it is added.");
      }
      listOf("Needs", n.needs.map(e => [e.to, e.min]));
      listOf("Needed by", n.neededBy.map(e => [e.from, ""]));
    }
    paint();
  };

  // Drag a mod to move it, drag the background to pan, wheel to zoom.
  const nodeAt = (target) => {
    const g = target.closest?.(".node");
    return g ? nodes.find(n => n.g === g) : null;
  };
  const toWorld = (ev) => {
    const box = svg.getBoundingClientRect();
    return [(ev.clientX - box.left - tx) / k, (ev.clientY - box.top - ty) / k];
  };
  // Zoom to `next`, keeping the world point under (sx, sy) on screen still.
  const zoomAt = (next, sx, sy, from = { k, tx, ty }) => {
    next = Math.max(0.25, Math.min(3, next));
    tx = sx - ((sx - from.tx) * next) / from.k;
    ty = sy - ((sy - from.ty) * next) / from.k;
    k = next;
    viewMoved = true;
    draw();
  };
  const local = (p) => {
    const box = svg.getBoundingClientRect();
    return [p.x - box.left, p.y - box.top];
  };
  const pointers = new Map();
  let drag = null, pinch = null;
  svg.addEventListener("pointerdown", (ev) => {
    if (ev.button !== 0) return;
    pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    svg.setPointerCapture(ev.pointerId);
    if (pointers.size === 2) {
      // A second finger turns the gesture into a pinch.
      if (drag?.n) drag.n.fixed = false;
      drag = null;
      const [a, b] = [...pointers.values()];
      const [mx, my] = local({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx, my, from: { k, tx, ty } };
      return;
    }
    const n = nodeAt(ev.target);
    drag = { n, sx: ev.clientX, sy: ev.clientY, tx, ty, moved: false };
    if (n) n.fixed = true; else svg.classList.add("panning");
  });
  svg.addEventListener("pointermove", (ev) => {
    if (pointers.has(ev.pointerId)) pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pinch && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const [mx, my] = local({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
      const scale = Math.hypot(a.x - b.x, a.y - b.y) / pinch.d;
      zoomAt(pinch.from.k * scale, pinch.mx, pinch.my, pinch.from);
      tx += mx - pinch.mx;
      ty += my - pinch.my;
      draw();
      return;
    }
    if (!drag) return;
    if (!drag.moved && Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) <= 3) return;
    drag.moved = true;
    if (drag.n) {
      [drag.n.x, drag.n.y] = toWorld(ev);
      draw();
      heat(0.3);
    } else {
      tx = drag.tx + ev.clientX - drag.sx;
      ty = drag.ty + ev.clientY - drag.sy;
      viewMoved = true;
      draw();
    }
  });
  const release = (ev) => {
    pointers.delete(ev.pointerId);
    if (pointers.size < 2) pinch = null;
    if (!drag) return;
    if (drag.n) drag.n.fixed = false;
    if (!drag.moved) select(drag.n && drag.n !== selected ? drag.n : null);
    svg.classList.remove("panning");
    drag = null;
  };
  svg.addEventListener("pointerup", release);
  svg.addEventListener("pointercancel", release);
  svg.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const [sx, sy] = local({ x: ev.clientX, y: ev.clientY });
    zoomAt(k * Math.exp(-ev.deltaY * 0.0015), sx, sy);
  }, { passive: false });
  // Follow the page's size until the reader moves the view themselves.
  new ResizeObserver(() => { if (fitted && !viewMoved) fit(); }).observe(svg);
  svg.addEventListener("pointerover", (ev) => { hover = nodeAt(ev.target); paint(); });
  svg.addEventListener("pointerleave", () => { hover = null; paint(); });
  svg.addEventListener("keydown", (ev) => {
    const n = nodeAt(ev.target);
    if (n && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); select(n); }
    else if (ev.key === "Escape") select(null);
  });

  return {
    wrap, edges,
    // Searching dims the mods that don't match instead of removing them.
    show(q) {
      query = q;
      if (!fitted) fit();
      paint();
      return nodes.filter(n => n.mod && matches(n)).length;
    },
  };
};

let view = "cards";
try { view = localStorage.getItem("view") || "cards"; } catch {}

const render = () => {
  const q = el("q").value.trim().toLowerCase();
  const shown = q
    ? MODS.filter(m => `${m.id} ${m.name} ${m.author}`.toLowerCase().includes(q))
    : MODS;
  el("v-cards").setAttribute("aria-pressed", view === "cards");
  el("v-table").setAttribute("aria-pressed", view === "table");
  el("v-graph").setAttribute("aria-pressed", view === "graph");
  if (view === "graph" && MODS.length) {
    graph ??= buildGraph();
    el("view").replaceChildren(graph.wrap);
    const lit = graph.show(q);
    const links = graph.edges.length;
    el("count").textContent = `${lit} of ${MODS.length} mod${MODS.length === 1 ? "" : "s"}, ${links} dependency link${links === 1 ? "" : "s"}`;
    el("note").textContent = lit === 0 ? "Nothing here matches that." : "";
    return;
  }
  if (view === "table") {
    el("view").replaceChildren(table(shown));
  } else {
    const grid = document.createElement("div");
    grid.className = "grid";
    grid.append(...shown.map(card));
    el("view").replaceChildren(grid);
  }
  el("count").textContent = `${shown.length} of ${MODS.length} mod${MODS.length === 1 ? "" : "s"}`;
  el("note").textContent =
    MODS.length === 0 ? "This index has no mods in it yet."
    : shown.length === 0 ? "Nothing here matches that." : "";
};

const setView = (next) => {
  view = next;
  try { localStorage.setItem("view", next); } catch {}
  render();
};
el("v-cards").addEventListener("click", () => setView("cards"));
el("v-table").addEventListener("click", () => setView("table"));
el("v-graph").addEventListener("click", () => setView("graph"));
el("q").addEventListener("input", render);
render();
</script>
</body>
</html>
