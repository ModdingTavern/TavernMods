name: Validate submissions

# Checks each submission PR and posts the result as a PR comment.
#
# Runs on pull_request_target so a fork PR gets VIRUSTOTAL_API_KEY and a token
# that can comment. That is only safe because nothing from the PR executes:
# the checkout is main, only the PR's submissions/ is overlaid, and the
# downloader refuses non-https URLs and non-public hosts.

on:
  pull_request_target:
    paths:
      - "submissions/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Require a fork PR to add exactly one submission file
        id: shape
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const isFork = pr.head.repo && pr.head.repo.full_name !== pr.base.repo.full_name;
            if (!isFork) {
              core.setOutput('ok', 'true');
              return;
            }
            const { owner, repo } = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr.number, per_page: 100 });
            const problems = [];
            const added = files.filter(f => f.status === 'added');
            if (files.length !== 1 || added.length !== 1) {
              problems.push(
                'A submission PR must add exactly one file and change nothing else. ' +
                'This PR touches ' + files.length + ' file(s): ' +
                files.map(f => f.filename + ' (' + f.status + ')').join(', ') + '.');
            }
            const pathRe = /^submissions\/[^/]+\/\d+\.\d+\.\d+\.json$/;
            for (const f of added) {
              if (!pathRe.test(f.filename)) {
                problems.push(f.filename + ' is not a valid submission path. Expected ' +
                  'submissions/<owner>.<repo>/<version>.json.');
              }
            }
            if (problems.length) {
              require('fs').writeFileSync('shape-problems.txt', problems.join('\n') + '\n');
              core.setOutput('ok', 'false');
            } else {
              core.setOutput('ok', 'true');
            }

      - name: Overlay the PR's submissions/ onto main
        if: steps.shape.outputs.ok == 'true'
        env:
          PR_REF: refs/pull/${{ github.event.pull_request.number }}/head
        run: |
          git fetch --no-tags --depth=1 origin "$PR_REF"
          git checkout FETCH_HEAD -- submissions

      - uses: actions/setup-python@v7
        if: steps.shape.outputs.ok == 'true'
        with:
          python-version: "3.x"

      - name: Validate
        id: validate
        if: steps.shape.outputs.ok == 'true'
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          VT_MAX_PER_MINUTE: ${{ vars.VT_MAX_PER_MINUTE }}
        # Never fails here so the comment step runs; the last step fails the check.
        run: |
          set +e
          python tools/modindex.py validate > validate-output.txt 2>&1
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat validate-output.txt

      - name: Post or update the PR comment
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- modindex-validation -->';
            let head, details = '';
            if (fs.existsSync('shape-problems.txt')) {
              const probs = fs.readFileSync('shape-problems.txt', 'utf8').trim().split('\n');
              head = '## Submission checks: FAILED\n\n' + probs.map(p => '- ' + p).join('\n');
            } else {
              const rc = '${{ steps.validate.outputs.rc }}';
              const output = fs.existsSync('validate-output.txt')
                ? fs.readFileSync('validate-output.txt', 'utf8') : '(no output)';
              head = rc === '0'
                ? '## Submission checks: PASSED\n\nA maintainer still reviews this before it can merge.'
                : '## Submission checks: FAILED\n\nFix the items below and push to this PR; the checks re-run on every push.';
              details = '\n\n<details><summary>Validation output</summary>\n\n```\n' + output + '\n```\n\n</details>';
            }
            const body = marker + '\n' + head + details;
            const { owner, repo } = context.repo;
            const prNum = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments(
              { owner, repo, issue_number: prNum, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNum, body });
            }

      - name: Fail the check if anything failed
        if: always()
        run: |
          [ "${{ steps.shape.outputs.ok }}" = "true" ] || { echo "Single-file submission gate failed."; exit 1; }
          [ "${{ steps.validate.outputs.rc }}" = "0" ] || { echo "Validation failed."; exit 1; }
