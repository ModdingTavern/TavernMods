name: Publish index

# After a merge to main: ingest submissions/ into manifests/, rebuild the
# latest*.json pointers and repository.json, and commit the result.
#
# main is protected, so the push uses a token from a GitHub App on the ruleset
# bypass list. Its client id and private key live as PUBLISH_APP_CLIENT_ID and
# PUBLISH_APP_PRIVATE_KEY in the "publish" environment, limited to main, so a
# workflow on any other branch can't read them.

on:
  push:
    branches: [main]
    paths:
      - "submissions/**"
      - "manifests/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

# One build at a time; a queued run still sees every merge, so never cancel.
concurrency:
  group: publish-index
  cancel-in-progress: false

jobs:
  build:
    # The app's own commit (unlike GITHUB_TOKEN's) triggers this workflow again.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(index)')
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PUBLISH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Rebuild the index and push it
        run: |
          git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          # If another commit lands first, rebuild from the new tip and retry.
          for attempt in 1 2 3; do
            python tools/modindex.py build --ingest --prune
            git add -A
            if git diff --cached --quiet; then
              echo "Index already up to date."
              exit 0
            fi
            git commit -m "chore(index): rebuild after merge"
            if git push; then
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
          done
          echo "could not push the index" >&2
          exit 1
